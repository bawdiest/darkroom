services:
  darkroom:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env            # ANTHROPIC_API_KEY=... (Vorlage: .env.example)
    environment:
      # DARKROOM_AI_PROVIDER: claude        # oder: ollama (dann OLLAMA_URL / OLLAMA_MODEL setzen)
      # DARKROOM_SANDBOX_MIN: bwrap         # nur senken, wenn du weisst, was du tust (unshare | none)
      DARKROOM_LIBRARY: /library
      DARKROOM_DATA: /data
    # bubblewrap braucht in Docker unprivilegierte User-Namespaces. Wenn die Statuszeile in der Dunkelkammer
    # "Sandbox: keine Isolation" oder "teilweise" zeigt, diese beiden Zeilen aktivieren (nicht getestet):
    # security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    volumes:
      # Foto-Bibliothek (RAWs + vorhandene XMPs). Originale werden nie veraendert,
      # nur der XMP-Export schreibt <RAW>.xmp daneben (vorher .bak-Sicherung).
      - /pfad/zu/deinen/fotos:/library
      # Parameter, Scripts, Presets: als Git-Repo fuehren (git init in ./data)
      - ./data:/data

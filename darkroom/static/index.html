<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkroom</title>
<style>
  :root { --bg:#1b1b1d; --panel:#242427; --line:#37373c; --fg:#e4e4e7; --mute:#8d8d95; --acc:#e0a24a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0 12px 0 0; letter-spacing:.04em; }
  button, select, input { background:#2e2e33; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#1b1b1d; border-color:var(--acc); }
  .spacer { flex:1; }
  main { flex:1; min-height:0; display:flex; }
  #filters { width:210px; padding:12px; border-right:1px solid var(--line); overflow:auto; display:flex; flex-direction:column; gap:10px; }
  #filters label { color:var(--mute); font-size:12px; display:block; margin-bottom:3px; }
  #filters select, #filters input { width:100%; }
  #grid { --cell:220px; flex:1; overflow:auto; padding:12px; display:grid; grid-template-columns:repeat(auto-fill,var(--cell)); justify-content:start; gap:10px; align-content:start; grid-auto-rows:max-content; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden; cursor:pointer; }
  .card:hover { border-color:var(--acc); }
  .card .ph { width:100%; height:calc(var(--cell) * 0.75); background:#111; position:relative; }  /* Höhe wächst mit der Breite */
  .badges { position:absolute; left:6px; top:6px; display:flex; gap:4px; z-index:1; }
  .badge { font-size:11px; line-height:1; padding:3px 6px; border-radius:10px; background:rgba(20,20,22,.82); color:var(--acc); border:1px solid rgba(224,162,74,.5); }
  .badge.sc { color:#7ee787; border-color:rgba(126,231,135,.5); }
  .card img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }  /* ganzes Foto, nie beschnitten */
  .card .meta { padding:5px 8px; font-size:12px; color:var(--mute); display:flex; justify-content:space-between; gap:6px; white-space:nowrap; overflow:hidden; }
  .card .meta span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .card .meta span:last-child { flex:none; }
  #dark { flex:1; display:none; min-width:0; }
  #preview { flex:1; display:flex; align-items:center; justify-content:center; background:#111; min-width:0; position:relative; }
  #preview img { max-width:100%; max-height:100%; }
  #status { position:absolute; left:10px; bottom:10px; color:var(--mute); font-size:12px; }
  #resizer { width:6px; cursor:col-resize; background:var(--line); flex:none; } #resizer:hover, #resizer.drag { background:var(--acc); }
  #side { width:400px; min-width:300px; max-width:85vw; flex:none; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--panel); }
  #side .bar { display:flex; gap:8px; padding:8px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .code { flex:1; min-height:0; position:relative; background:#18181a; }
  .code pre, .code textarea { position:absolute; inset:0; margin:0; width:100%; height:100%; border:0; padding:12px; font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; tab-size:4; white-space:pre; overflow:auto; }
  .code pre { pointer-events:none; overflow:hidden; color:var(--fg); }
  .code textarea { background:transparent; color:transparent; caret-color:var(--fg); resize:none; outline:none; z-index:1; }
  .code textarea::selection { background:rgba(224,162,74,.35); color:transparent; }
  .code textarea::placeholder { color:var(--mute); }
  .tk-c{color:#8b949e;font-style:italic} .tk-s{color:#a5d6ff} .tk-n{color:#79c0ff} .tk-k{color:#ff7b72} .tk-f{color:#d2a8ff} .tk-b{color:#ffa657} .tk-y{color:#7ee787}
  .tabs { display:flex; gap:6px; align-items:center; padding:8px 8px 0; }
  .tabs button { border-radius:6px 6px 0 0; border-bottom:0; }
  .pane { flex:1; min-height:0; display:flex; flex-direction:column; }
  #desc { height:72px; flex:none; background:#18181a; color:var(--fg); border:0; border-bottom:1px solid var(--line); resize:vertical; padding:10px 12px; font:13px/1.4 system-ui, sans-serif; outline:none; }
  #sbx { font-size:11px; color:var(--mute); } #sbx.bad { color:#ff7b72; }
  #genStatus { font-size:12px; color:var(--mute); white-space:pre-wrap; }
  .foot { border-top:1px solid var(--line); border-bottom:0 !important; }
  #err { color:#ff7b72; padding:6px 12px; font-size:12px; min-height:26px; border-top:1px solid var(--line); white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>DARKROOM</h1>
  <button id="tabLight" class="on">Leuchttisch</button>
  <button id="tabDark" disabled>Dunkelkammer</button>
  <span class="spacer"></span>
  <span id="lightTools">
    <button id="scan">Bibliothek scannen</button>
    <button id="match" title="Unbearbeitete RAWs im Hintergrund an das eingebettete Kamera-Vorschaubild angleichen. Klick während des Laufs stoppt den Job.">Angleichen</button>
    <button id="ai" title="KI-Funktionen folgen">KI ▾</button>
    <button id="exportXmp">XMP exportieren</button>
  </span>
</header>
<main>
  <section id="lighttable" style="display:flex; flex:1; min-width:0;">
    <aside id="filters">
      <div><label>Suche</label><input id="fq" placeholder="Name oder Tag"></div>
      <div><label>Kamera</label><select id="fcam"><option value="">alle</option></select></div>
      <div><label>Objektiv</label><select id="flens"><option value="">alle</option></select></div>
      <div><label>Mindestbewertung</label><select id="frate"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
      <div><label>Bearbeitung</label><select id="fstate"><option value="">alle</option><option value="edited">bearbeitet</option><option value="script">mit Script</option><option value="unedited">unbearbeitet</option></select></div>
      <div><label>Tag</label><select id="ftag"><option value="">alle</option></select></div>
      <div><label>Grösse der Vorschau <span id="sizeVal" style="float:right"></span></label>
        <input id="size" type="range" min="100" max="520" step="10" style="padding:0" title="Strg + Mausrad im Raster ändert die Grösse ebenfalls"></div>
      <div id="count" style="color:var(--mute)"></div>
    </aside>
    <div id="grid"></div>
  </section>
  <section id="dark">
    <div style="display:flex; height:100%;">
      <div id="preview"><img id="pimg" alt=""><div id="status"></div></div>
      <div id="resizer" title="Ziehen, um die Breite zu ändern"></div>
      <div id="side">
        <div class="tabs">
          <button id="tabYaml" class="on">Parameter</button>
          <button id="tabScript">Script</button>
          <span class="spacer"></span><span id="sbx"></span>
        </div>
        <div id="paneYaml" class="pane">
          <div class="bar">
            <select id="presetSel"><option value="">Preset einfügen…</option></select>
            <button id="savePreset">Als Preset speichern</button>
          </div>
          <div class="code"><textarea id="editor" spellcheck="false" wrap="off"></textarea></div>
        </div>
        <div id="paneScript" class="pane" style="display:none">
          <textarea id="desc" placeholder="Beschreibe, was mit dem Foto passieren soll, z. B. «Himmel etwas abdunkeln, Schatten weniger rauschen» …"></textarea>
          <div class="bar"><button id="gen">Code erzeugen</button>
            <select id="spSel"><option value="">Preset laden…</option></select>
            <button id="saveSp" title="Script als Preset speichern">Als Preset speichern</button>
            <span id="genStatus" style="flex-basis:100%"></span></div>
          <div class="code"><textarea id="scriptEditor" spellcheck="false" wrap="off" placeholder="Noch kein Script. Beschreibung oben eingeben und «Code erzeugen» drücken oder selbst schreiben: def process(img, p): ..."></textarea></div>
        </div>
        <div class="bar foot">
          <button id="save">Speichern (Strg+S)</button>
          <button id="run" title="Strg+Enter">Vorschau</button>
          <select id="profSel"></select>
          <button id="exportBtn">Exportieren</button>
        </div>
        <div id="err"></div>
      </div>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let current = null, timer = null, seq = 0;

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);
  return r;
}

// ---------- Leuchttisch ----------
async function loadFacets() {
  const f = await (await api('/api/facets')).json();
  const fill = (sel, arr) => { const el = $(sel), v = el.value; el.length = 1; arr.forEach(x => el.add(new Option(x, x))); el.value = v; };
  fill('#fcam', f.cameras); fill('#flens', f.lenses); fill('#ftag', f.tags);
}
function badges(ph) {
  const b = (ph.edited ? '<span class="badge" title="Parameter bearbeitet">✎ bearbeitet</span>' : '') +
            (ph.has_script ? '<span class="badge sc" title="Hat ein Script">&lt;/&gt; Script</span>' : '');
  return b ? `<div class="badges">${b}</div>` : '';
}
// Aktualisiert Marker und Vorschaubilder der sichtbaren Karten, ohne das Raster neu aufzubauen
async function refreshCards() {
  const p = new URLSearchParams({ q:$('#fq').value, camera:$('#fcam').value, lens:$('#flens').value, min_rating:$('#frate').value, tag:$('#ftag').value, state:$('#fstate').value });
  for (const [k,v] of [...p]) if (!v) p.delete(k);
  const list = await (await api('/api/photos?' + p)).json();
  let pending = false;
  for (const ph of list) {
    const card = $(`.card[data-id="${ph.id}"]`); if (!card) continue;
    const img = card.querySelector('img'), want = `/api/thumb/${ph.id}?v=${ph.thumb_v}`;
    if (img.getAttribute('src') !== want) img.src = want;
    const old = card.querySelector('.badges'); if (old) old.remove();
    card.querySelector('.ph').insertAdjacentHTML('afterbegin', badges(ph));
    if (ph.thumb_stale) pending = true;
  }
  return pending;
}
let pollTimer = null;
function pollThumbs(n = 8) {  // nach dem Speichern: Vorschaubild entsteht im Hintergrund
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => { try { if (await refreshCards() && n > 0) pollThumbs(n - 1); } catch (e) {} }, 2500);
}
async function loadGrid() {
  const p = new URLSearchParams({ q:$('#fq').value, camera:$('#fcam').value, lens:$('#flens').value, min_rating:$('#frate').value, tag:$('#ftag').value, state:$('#fstate').value });
  for (const [k,v] of [...p]) if (!v) p.delete(k);
  const list = await (await api('/api/photos?' + p)).json();
  $('#count').textContent = list.length + ' Fotos';
  $('#grid').innerHTML = '';
  for (const ph of list) {
    const d = document.createElement('div'); d.className = 'card';
    d.dataset.id = ph.id;
    d.innerHTML = `<div class="ph">${badges(ph)}<img loading="lazy" src="/api/thumb/${ph.id}?v=${ph.thumb_v}"></div><div class="meta"><span>${ph.path.split('/').pop()}</span><span>${'★'.repeat(ph.rating)}</span></div>`;
    d.onclick = () => openDark(ph);
    $('#grid').appendChild(d);
  }
}
['#fq','#fcam','#flens','#frate','#ftag','#fstate'].forEach(s => $(s).addEventListener('input', loadGrid));
$('#scan').onclick = async () => {
  $('#scan').textContent = 'Scanne…';
  try { const s = await (await api('/api/scan', {method:'POST'})).json();
    alert(`Neu: ${s.neu}\nXMP importiert: ${s.xmp_importiert}\nBereits vorhanden: ${s.vorhanden}` + (s.fehler.length ? `\nFehler:\n${s.fehler.join('\n')}` : '')); }
  catch (e) { alert(e.message); }
  $('#scan').textContent = 'Bibliothek scannen'; await loadFacets(); await loadGrid();
};
// ---------- Hintergrundjob: Angleichen an das Kamera-Vorschaubild ----------
let matchTimer = null;
function matchLabel(st) {
  return st.running ? `Angleichen ${st.done}/${st.total} ■` : 'Angleichen';
}
async function pollMatch() {
  clearTimeout(matchTimer);
  try {
    const st = await (await api('/api/jobs/match')).json();
    $('#match').textContent = matchLabel(st); $('#match').classList.toggle('on', st.running);
    $('#match').title = st.running ? `Läuft: ${st.aktuell}. Klick = stoppen.` : $('#match').title;
    if (st.running) { matchTimer = setTimeout(pollMatch, 2000); if (st.done % 5 === 0) refreshCards().catch(() => {}); }
    else if (st.total) {
      await refreshCards().catch(() => {});
      $('#count').textContent = `Angleichen fertig: ${st.angeglichen} angeglichen, ${st.uebersprungen} übersprungen` + (st.fehler ? `, ${st.fehler} Fehler` : '');
    }
  } catch (e) {}
}
$('#match').onclick = async () => {
  const st = await (await api('/api/jobs/match')).json();
  if (st.running) { await api('/api/jobs/match', {method:'DELETE'}); }
  else {
    const r = await (await api('/api/jobs/match', {method:'POST'})).json();
    if (!r.total) { $('#count').textContent = 'Nichts zu tun: alle Fotos sind bearbeitet oder bereits angeglichen.'; return; }
  }
  pollMatch();
};
pollMatch();
$('#ai').onclick = () => alert('KI-Funktionen (automatisch taggen u. a.) folgen im nächsten Schritt.');
$('#exportXmp').onclick = async () => {
  if (!confirm('XMP-Dateien für alle Fotos neben die Originale schreiben? Bestehende XMPs werden als .bak gesichert.')) return;
  const r = await (await api('/api/export-xmp', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})).json();
  alert(r.geschrieben + ' XMP-Dateien geschrieben.');
};

// ---------- Dunkelkammer ----------
function show(view) {
  $('#lighttable').style.display = view === 'light' ? 'flex' : 'none';
  $('#dark').style.display = view === 'dark' ? 'block' : 'none';
  $('#lightTools').style.display = view === 'light' ? '' : 'none';
  $('#tabLight').classList.toggle('on', view === 'light');
  $('#tabDark').classList.toggle('on', view === 'dark');
}
$('#tabLight').onclick = async () => { show('light'); await loadGrid(); if (dirty) { dirty = false; pollThumbs(); } };
let dirty = false;
$('#tabDark').onclick = () => current && show('dark');

async function openDark(ph) {
  current = ph; $('#tabDark').disabled = false; show('dark');
  $('#err').textContent = '';
  $('#editor').value = (await (await api(`/api/photos/${ph.id}/params`)).json()).yaml;
  $('#scriptEditor').value = (await (await api(`/api/photos/${ph.id}/script`)).json()).script;
  $('#desc').value = ''; $('#genStatus').textContent = '';
  const pre = await (await api('/api/presets')).json();
  const sel = $('#presetSel'); sel.length = 1; pre.forEach(n => sel.add(new Option(n, n)));
  const sp = await (await api('/api/script-presets')).json();
  const ssel = $('#spSel'); ssel.length = 1; sp.forEach(n => ssel.add(new Option(n, n)));
  renderPreview();
}
async function renderPreview() {
  const my = ++seq; $('#status').textContent = 'rendert…';
  try {
    const r = await api(`/api/photos/${current.id}/preview`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({yaml:$('#editor').value, script:$('#scriptEditor').value})});
    if (my !== seq) return;
    const url = URL.createObjectURL(await r.blob());
    $('#pimg').onload = () => URL.revokeObjectURL(url);
    $('#pimg').src = url; $('#err').textContent = ''; $('#status').textContent = '';
  } catch (e) { if (my === seq) { $('#err').textContent = e.message; $('#status').textContent = ''; } }
}
async function save() {
  const j = body => ({method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  try {
    await api(`/api/photos/${current.id}/params`, j({yaml:$('#editor').value}));
    await api(`/api/photos/${current.id}/script`, j({script:$('#scriptEditor').value}));
    $('#status').textContent = 'gespeichert'; dirty = true; renderPreview();
  } catch (e) { $('#err').textContent = e.message; }
}
$('#save').onclick = save;
function keys(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); renderPreview(); }
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, e.target.id === 'scriptEditor' ? '    ' : '  '); }
}
$('#editor').addEventListener('keydown', keys);
$('#scriptEditor').addEventListener('keydown', keys);
// Parameter: Vorschau automatisch nach kurzer Pause. Script-Änderungen laufen erst mit Strg+Enter / «Vorschau».
$('#editor').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(renderPreview, $('#scriptEditor').value.trim() ? 1500 : 700); });
$('#run').onclick = renderPreview;

// ---------- Editor mit Syntax-Highlighting (ohne externe Bibliothek) ----------
const PY_KW = new Set('False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));
const PY_BUILTIN = new Set('np cv2 skimage scipy math range len min max abs sum int float bool str list dict tuple set zip enumerate map sorted round print isinstance'.split(' '));
const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const span = (c, t) => `<span class="tk-${c}">${esc(t)}</span>`;
function hlPython(src) {
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+\.?\d*(?:[eE][+-]?\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = '', last = 0, prev = '', m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += span('c', m[1]);
    else if (m[2]) out += span('s', m[2]);
    else if (m[3]) out += span('n', m[3]);
    else {
      const w = m[4];
      out += (prev === 'def' || prev === 'class') ? span('f', w) : PY_KW.has(w) ? span('k', w) : PY_BUILTIN.has(w) ? span('b', w) : esc(w);
      prev = w; continue;
    }
    prev = '';
  }
  return out + esc(src.slice(last));
}
function hlYaml(src) {
  const val = t => esc(t).replace(/(#.*)$/, '<span class="tk-c">$1</span>')
    .replace(/(^|[\s\[,])(-?\d+\.?\d*)(?=$|[\s,\]#])/g, '$1<span class="tk-n">$2</span>')
    .replace(/\b(true|false|null|yes|no)\b/g, '<span class="tk-k">$1</span>');
  return src.split('\n').map(line => {
    if (/^\s*#/.test(line)) return span('c', line);
    const m = line.match(/^(\s*-?\s*)([\w.\-]+)(\s*:)(.*)$/);
    return m ? esc(m[1]) + span('y', m[2]) + esc(m[3]) + val(m[4]) : val(line);
  }).join('\n');
}
function makeEditor(ta, hl) {
  const pre = document.createElement('pre'); pre.setAttribute('aria-hidden', 'true');
  ta.parentNode.insertBefore(pre, ta);
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; };
  const draw = () => { pre.innerHTML = hl(ta.value) + '\n '; sync(); };
  const desc = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value');
  Object.defineProperty(ta, 'value', { get() { return desc.get.call(this); }, set(v) { desc.set.call(this, v); draw(); } });
  ta.addEventListener('input', draw);
  ta.addEventListener('scroll', sync);
  draw();
}
makeEditor($('#editor'), hlYaml);
makeEditor($('#scriptEditor'), hlPython);

// ---------- Breite der Seitenleiste (ziehbar, wird gemerkt) ----------
const side = $('#side');
try { const w = +localStorage.getItem('sideW'); if (w) side.style.width = w + 'px'; } catch (e) {}
$('#resizer').addEventListener('pointerdown', e => {
  const r = $('#resizer'); r.setPointerCapture(e.pointerId); r.classList.add('drag');
  const move = ev => { side.style.width = Math.max(300, Math.min(innerWidth * 0.85, innerWidth - ev.clientX)) + 'px'; };
  const up = () => { r.classList.remove('drag'); r.removeEventListener('pointermove', move); r.removeEventListener('pointerup', up);
    try { localStorage.setItem('sideW', parseInt(side.style.width)); } catch (e) {} };
  r.addEventListener('pointermove', move); r.addEventListener('pointerup', up);
});

function tab(which) {
  let saved = null; try { saved = localStorage.getItem('sideW'); } catch (e) {}
  if (!saved) side.style.width = which === 'script' ? Math.min(760, innerWidth * 0.55) + 'px' : '400px';
  $('#paneYaml').style.display = which === 'yaml' ? 'flex' : 'none';
  $('#paneScript').style.display = which === 'script' ? 'flex' : 'none';
  $('#tabYaml').classList.toggle('on', which === 'yaml'); $('#tabScript').classList.toggle('on', which === 'script');
}
$('#tabYaml').onclick = () => tab('yaml'); $('#tabScript').onclick = () => tab('script');

$('#gen').onclick = async () => {
  const prompt = $('#desc').value.trim(); if (!prompt) { $('#genStatus').textContent = 'Bitte zuerst beschreiben, was passieren soll.'; return; }
  $('#gen').disabled = true; $('#genStatus').textContent = 'KI schreibt und testet das Script …';
  try {
    const r = await (await api(`/api/photos/${current.id}/generate`, {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt, yaml:$('#editor').value, script:$('#scriptEditor').value})})).json();
    if (r.code) $('#scriptEditor').value = r.code;
    $('#genStatus').textContent = (r.ok ? `Fertig nach ${r.attempts} Versuch(en). ` : (r.error + ' ')) + (r.explanation || '') + '\n' + r.log.join('\n');
    if (r.ok) renderPreview();
  } catch (e) { $('#genStatus').textContent = e.message; }
  $('#gen').disabled = false;
};
$('#spSel').onchange = async e => {
  if (!e.target.value) return;
  $('#scriptEditor').value = (await (await api('/api/script-presets/' + e.target.value)).json()).script;
  e.target.value = ''; renderPreview();
};
$('#saveSp').onclick = async () => {
  const name = prompt('Name des Script-Presets:'); if (!name) return;
  try { const r = await (await api('/api/script-presets', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, script:$('#scriptEditor').value})})).json();
    $('#spSel').add(new Option(r.name, r.name)); alert('Script-Preset gespeichert: ' + r.name); }
  catch (e) { alert(e.message); }
};
$('#exportBtn').onclick = async () => {
  await save();
  $('#status').textContent = 'exportiere …';
  try {
    const r = await api(`/api/photos/${current.id}/export`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({profile:$('#profSel').value})});
    const blob = await r.blob(), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = current.path.split('/').pop().replace(/\.[^.]+$/, '') + (blob.type.includes('tif') ? '.tif' : '.jpg'); a.click();
    $('#status').textContent = 'exportiert (auch in data/exports gespeichert)';
  } catch (e) { $('#err').textContent = e.message; $('#status').textContent = ''; }
};
(async () => {
  const pr = await (await api('/api/output-profiles')).json();
  Object.entries(pr).forEach(([k, v]) => $('#profSel').add(new Option(`${k} (${v.format}, ${v.color_space}${v.max_side ? ', ' + v.max_side + ' px' : ''})`, k)));
  const st = await (await api('/api/status')).json();
  $('#sbx').textContent = 'Sandbox: ' + st.sandbox.description + (st.ai.configured ? '' : ' · KI nicht konfiguriert');
  $('#sbx').classList.toggle('bad', !st.sandbox.allowed || !st.ai.configured);
})();
$('#presetSel').onchange = e => {
  if (!e.target.value) return;
  const ed = $('#editor'); ed.value = `preset: ${e.target.value}\n` + ed.value.replace(/^preset:.*\n/m, '');
  e.target.value = ''; renderPreview();
};
$('#savePreset').onclick = async () => {
  const name = prompt('Name des Presets:'); if (!name) return;
  try { const r = await (await api('/api/presets', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, yaml:$('#editor').value})})).json();
    alert('Preset gespeichert: ' + r.name); const sel = $('#presetSel'); sel.add(new Option(r.name, r.name)); }
  catch (e) { alert(e.message); }
};

// Vorschaugrösse (wie in darktable): Regler und Strg + Mausrad, wird im Browser gemerkt
function setSize(v, save = true) {
  v = Math.max(100, Math.min(520, Math.round(v / 10) * 10));
  $('#grid').style.setProperty('--cell', v + 'px'); $('#size').value = v; $('#sizeVal').textContent = v + ' px';
  if (save) { try { localStorage.setItem('darkroom.cell', v); } catch (e) {} }
}
let savedSize = 220; try { savedSize = parseInt(localStorage.getItem('darkroom.cell')) || 220; } catch (e) {}
setSize(savedSize, false);
$('#size').addEventListener('input', e => setSize(+e.target.value));
$('#grid').addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setSize(+$('#size').value + (e.deltaY < 0 ? 20 : -20)); } }, {passive:false});

loadFacets(); loadGrid();
</script>
</body>

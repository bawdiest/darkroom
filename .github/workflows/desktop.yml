# Baut die Desktop-App auf GitHubs eigenen Windows-, macOS- und Linux-Rechnern und stellt sie als Release zum Download bereit.
#   - Bei jedem Push und Pull Request laufen nur die Tests.
#   - Setzt du einen Tag «v…» (z. B. v0.2.0) und pushst ihn, werden alle Apps gebaut und unter «Releases» veröffentlicht.
#   - Von Hand starten: Actions -> «Desktop-App» -> Run workflow (baut, veröffentlicht aber nichts).
#   - Windows ARM64 (nativ) baut der Job «build-windows-arm»: bei einem Tag, von Hand und bei einem Push auf den Branch «arm-build».
#     Beim Push auf «arm-build» hängt er das ZIP an das schon bestehende Release der aktuellen Version an (ohne neuen Tag).
name: Desktop-App

on:
  push:
    branches: [main, arm-build]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap libglib2.0-0 libgl1
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # Die Sandbox-Tests brauchen unprivilegierte User-Namespaces (bubblewrap). Auf GitHubs Ubuntu-Rechnern sind sie gesperrt, im Job
  # «test» werden diese Tests deshalb übersprungen. Hier werden sie erlaubt und die Tests laufen wirklich; der Job blockiert
  # das Release nicht (continue-on-error), zeigt aber, ob die Sandbox auf einem normalen Linux funktioniert.
  sandbox-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap libglib2.0-0 libgl1
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_sandbox.py tests/test_automatch.py

  build:
    # Gebaut wird nur für einen Tag oder von Hand; ein Betriebssystem kann nur für sich selbst bauen.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # mehrere Muster müssen auf getrennten Zeilen stehen (\n), sonst gilt «dist/*.zip dist/*-setup.exe» als ein Muster
          - { os: windows-latest, name: windows-x64, pattern: "dist/*.zip\ndist/*-setup.exe" }
          - { os: macos-latest, name: macos, pattern: "dist/*.dmg" }
          - { os: ubuntu-latest, name: linux, pattern: "dist/*.tar.gz" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Systembibliotheken für Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libasound2t64
      - name: Inno Setup in den Pfad (Windows, für den Installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $iscc) { echo $iscc | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
      - name: Bauen und prüfen (Smoke-Test inklusive)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -ExecutionPolicy Bypass -File desktop/build.ps1
          else
            bash desktop/build.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: darkroom-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Windows on ARM nativ (GitHubs ARM-Rechner gibt es für öffentliche Repos). Läuft bei einem Tag, von Hand und beim Push auf den
  # Branch «arm-build». Ein Fehler hier blockiert das Release der anderen Apps nicht (continue-on-error).
  build-windows-arm:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arm-build'
    needs: test
    runs-on: windows-11-arm
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Bauen und prüfen (ohne OpenCV, siehe darkroom/cvx.py)
        shell: pwsh
        run: ./desktop/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: darkroom-windows-arm64
          path: dist/*-arm64*.zip
          if-no-files-found: error
      - name: An das bestehende Release anhängen (nur Branch arm-build)
        if: github.ref == 'refs/heads/arm-build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path darkroom/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          gh release upload "v$version" (Get-ChildItem dist/*-arm64*.zip).FullName --clobber --repo "${{ github.repository }}"

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && contains('success skipped failure', needs.build-windows-arm.result) }}
    needs: [build, build-windows-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh artifacts
          gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" \
            --title "Darkroom ${{ github.ref_name }}" \
            --notes "Desktop-App für Windows (x64: Installer und ZIP, läuft auch auf ARM per Emulation; ARM64 nativ, falls gebaut), macOS (dmg, Apple Silicon) und Linux (tar.gz). Nicht signiert: Hinweise zum ersten Start stehen im README, Abschnitt «Desktop-App»."
